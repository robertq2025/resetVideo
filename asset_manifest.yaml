derived_frames:
  dir: "assets/keyframes/derived"
  count: 29
  builder: "build_frames.py"
  provenance: "exports/REBOOT_derived_frames.csv"
  method:
    clip_crop: "从已交付镜头按 ≤2.2× 放大裁切（同脸/同衣/同光），可加 red/green/cold/warm 重打光"
    overlay_plate: "用 assets/overlays 的真实文字贴图合成暗背景底板（屏幕与纸面类镜头）"
  covers: ["S01", "S02", "S04", "S06", "S07", "S08", "S09", "S12", "S13", "S15", "S16", "S17",
           "S19", "S20", "S22", "S24", "S25", "S26", "S27", "S29", "S30", "S31", "S33", "S34",
           "S36", "S37", "S41", "S42", "S43"]
  note: "作用是让 3:20 预视不再出现灰色占位卡，并给外部工具一张可直接用的首帧；
         这些帧不是最终画面，镜头生成后应替换。"

